name: Android preview
on:
  workflow_dispatch:
  push:
    branches: [preview]

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Expo project configuration
        run: |
          node -e 'const {expo} = require("./app.json"); if (!expo.extra?.eas?.projectId || !expo.updates?.url || !expo.runtimeVersion) { console.error("Run eas init and eas update:configure, then commit app.json."); process.exit(1); }'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish Android update
        run: eas update --channel preview --platform android --environment preview --auto --non-interactive
